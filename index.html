<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow | Dark Academic Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#22d3ee" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#g)" opacity="0.25" />
          <path d="M17 36V18h4l7 9 7-9h4v18h-4V25l-7 9-7-9v11h-4z" fill="#e2e8f0" />
        </svg>
        <div>
          <h1>StudyFlow</h1>
          <p>Dark-theme AI study dashboard</p>
        </div>
      </div>

      <nav id="top-nav" class="top-nav"></nav>
    </header>

    <main id="app" class="app"></main>

    <dialog id="item-modal" class="item-modal"></dialog>

    <template id="dashboard-view">
      <section class="stats-grid" id="stats-grid"></section>
      <section class="split-grid">
        <article class="card">
          <div class="card-head">
            <h3>Upcoming Deadlines</h3>
            <button class="btn btn-ghost" data-nav="calendar">Open Calendar</button>
          </div>
          <div id="upcoming-list" class="list"></div>
        </article>
        <article class="card">
          <h3>High Priority</h3>
          <div id="priority-list" class="list"></div>
        </article>
      </section>
      <section class="split-grid">
        <article class="card">
          <h3>Recent Uploads</h3>
          <div id="recent-uploads" class="list"></div>
        </article>
        <article class="card">
          <h3>Quick Actions</h3>
          <div class="action-row">
            <button class="btn btn-primary" data-nav="add">+ Add New Item</button>
            <button class="btn btn-secondary" data-nav="study">Open Study Tools</button>
            <button class="btn btn-secondary" data-nav="classes">View by Class</button>
          </div>
        </article>
      </section>
    </template>

    <template id="add-view">
      <section class="card">
        <h2>Add New Academic Item</h2>
        <form id="add-form" class="grid-form">
          <label>Title <input name="title" type="text" required /></label>
          <label>Class Name <input name="className" type="text" required /></label>
          <label>Professor (optional) <input name="professor" type="text" /></label>
          <label>
            Type
            <select name="type" required>
              <option value="Exam">Exam</option>
              <option value="Project">Project</option>
              <option value="Assignment">Assignment</option>
            </select>
          </label>
          <label>Due Date / Exam Date <input name="dueDate" type="date" required /></label>
          <label>
            Priority
            <select name="priority" required>
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </label>
          <label>Notes<textarea name="notes" rows="5"></textarea></label>
          <label>
            Upload Materials (.txt / .pdf)
            <input id="add-files" type="file" accept=".txt,.pdf" multiple />
          </label>
          <p id="add-upload-status" class="muted"></p>
          <ul id="add-upload-list" class="file-list"></ul>
          <div class="action-row">
            <button type="submit" class="btn btn-primary">Save Item</button>
            <button type="button" id="reset-add" class="btn btn-ghost">Reset</button>
          </div>
        </form>
      </section>
    </template>

    <template id="calendar-view">
      <section class="card">
        <div class="calendar-head">
          <button id="prev-month" class="btn btn-ghost">←</button>
          <h2 id="calendar-title"></h2>
          <button id="next-month" class="btn btn-ghost">→</button>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>
      <section class="card">
        <h3>Upcoming Deadlines</h3>
        <div id="calendar-upcoming" class="list"></div>
      </section>
    </template>

    <template id="classes-view">
      <section class="card">
        <h2>Classes View</h2>
        <div id="classes-grouped" class="classes-grouped"></div>
      </section>
    </template>

    <template id="study-view">
      <section class="card">
        <h2>Study Tools</h2>
        <label>
          Select Item
          <select id="study-select"></select>
        </label>
        <div id="study-buttons" class="action-row"></div>
        <div id="study-output" class="output"></div>
      </section>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
