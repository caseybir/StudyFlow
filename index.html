<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow | AI Academic Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar card">
        <h1>StudyFlow</h1>
        <p class="subtitle">AI-powered academic dashboard</p>
        <ul class="sidebar-list">
          <li>📚 Class Workspaces</li>
          <li>🧠 Exam Prep + Assignments</li>
          <li>💬 Tutor Chat</li>
          <li>📈 Readiness Tracking</li>
        </ul>
      </aside>

      <main id="app" class="main-view"></main>
    </div>

    <template id="dashboard-template">
      <section class="dashboard-header card">
        <div>
          <h2>Dashboard</h2>
          <p>Manage your classes, track readiness, and launch focused workspaces.</p>
        </div>
        <button id="open-add-class" class="btn btn-primary">+ Add New Class</button>
      </section>

      <section class="card add-class hidden" id="add-class-panel">
        <h3>Add Class</h3>
        <form id="class-form" class="grid-form">
          <label>Class Name <input type="text" name="name" required /></label>
          <label>Professor Name <input type="text" name="professor" required /></label>
          <label>
            Task Type
            <select name="taskType" required>
              <option value="exam">Exam</option>
              <option value="project">Project / Assignment</option>
            </select>
          </label>
          <label>Next Due / Exam Date <input type="date" name="examDate" required /></label>
          <label>Course Tag / Color <input type="text" name="tag" placeholder="optional" /></label>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Save Class</button>
            <button class="btn btn-ghost" type="button" id="cancel-add-class">Cancel</button>
          </div>
        </form>
      </section>

      <section>
        <h3 class="section-title">Your Classes</h3>
        <div id="class-grid" class="class-grid"></div>
      </section>
    </template>

    <template id="workspace-template">
      <section class="workspace-header card">
        <div class="workspace-title-wrap">
          <button id="back-btn" class="btn btn-ghost">← Dashboard</button>
          <div>
            <h2 id="workspace-title"></h2>
            <p id="workspace-meta"></p>
          </div>
        </div>
        <div id="overview-readiness"></div>
      </section>

      <section class="tabs card">
        <div class="tab-nav" id="tab-nav"></div>
      </section>

      <section id="tab-content"></section>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
